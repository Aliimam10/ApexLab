[project]
name = "racing-line"
version = "0.1.0"
description = "Physics-based racing-line optimisation project"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racing_line"]

[tool.pytest.ini_options]
testpaths = ["tests"]
